project:
  description: DMACU port to NXP LPC1769 on LPCxpresso1769 eval board
  compiler: AC6

  packs:
    - pack: Keil::LPC1700_DFP@2.7.2
    - pack: ARM::CMSIS@5.9.0

  groups:
    - group: vcpu
      files:
        - file: ../../vcpu/dmacu.h
        - file: ../../vcpu/dmacu_instance.c
        - file: ../../vcpu/dmacu_instance.h
        - file: ../../vcpu/dmacu_shared.c
        - file: ../../vcpu/rt.c
        - file: ../../vcpu/utils.c
        - file: ../../vcpu/vpl080.c

    - group: port
      files:
        - file: ./lpc176x.c

    - group: mc
      files:
        - file: ../../vcpu/mc/demo.code.inc
        - file: ../../vcpu/mc/demo.data.inc

  define:
  - DMACU_ROM_ALIGNMENT: "0x4"
  - DMACU_VIRTUAL_PL080: "0"
  - DMACU_QUIET: "1"

  add-path:
    - ../../vcpu

  linker:
    - for-compiler: AC6      
      script: ./lpc176x.sct
      define:
        - DMACU_VIRTUAL_PL080: 0

  output:
    type:
    - elf
    - hex

  components:
    - component: ARM::CMSIS:CORE
    - component: Keil::Device:Startup
